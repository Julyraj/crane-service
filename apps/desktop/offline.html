<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>CraneGo · Offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #17181c; color: #f1f1f3; font-family: system-ui, sans-serif; text-align: center; }
      button { margin: 6px; padding: 12px 18px; border: 0; border-radius: 10px; background: #ffb800; color: #1a1400; font-weight: 700; cursor: pointer; }
      .ghost { background: transparent; color: #f1f1f3; border: 1px solid #383b42; }
      p { color: #a8abb3; }
    </style>
  </head>
  <body>
    <div>
      <h1>Can't reach the CraneGo server</h1>
      <p id="u"></p>
      <button onclick="window.cranego.retry()">Try again</button>
      <button class="ghost" onclick="location.href='settings.html'">Change server</button>
    </div>
    <script>document.getElementById("u").textContent = new URLSearchParams(location.search).get("url") || "";</script>
  </body>
</html>
