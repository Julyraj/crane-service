<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>CraneGo · Server settings</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #17181c; color: #f1f1f3; font-family: system-ui, sans-serif; }
      form { width: min(420px, 90vw); background: #1f2126; padding: 28px; border-radius: 16px; display: grid; gap: 14px; }
      h1 { margin: 0; font-size: 22px; } p { margin: 0; color: #a8abb3; font-size: 14px; }
      input { padding: 12px; border-radius: 10px; border: 1px solid #383b42; background: #121316; color: inherit; font-size: 15px; }
      button { padding: 12px; border: 0; border-radius: 10px; background: #ffb800; color: #1a1400; font-weight: 700; font-size: 15px; cursor: pointer; }
      .err { color: #ff7b7f; min-height: 1em; }
    </style>
  </head>
  <body>
    <form id="f">
      <h1>▲ CraneGo</h1>
      <p>Enter the address of your CraneGo server, e.g. https://book.yourcompany.in</p>
      <input id="url" type="url" required placeholder="https://" />
      <p class="err" id="err"></p>
      <button>Connect</button>
    </form>
    <script>
      const url = document.getElementById("url");
      window.cranego.getConfig().then((c) => (url.value = c.serverUrl || "http://localhost:4100"));
      document.getElementById("f").addEventListener("submit", async (e) => {
        e.preventDefault();
        try { await window.cranego.saveConfig({ serverUrl: url.value }); }
        catch (err) { document.getElementById("err").textContent = String(err.message || err).replace(/^.*Error: /, ""); }
      });
    </script>
  </body>
</html>
